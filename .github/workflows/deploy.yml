# ──────────────────────────────────────────────────────────────
# fich-frontend — Build + Deploy to the Fich VPS
#
# On push to `main` (or via manual workflow_dispatch):
#   1. Build a Docker image, baking the prod NEXT_PUBLIC_* env into
#      the client bundle. Push to GHCR under the repo owner's
#      namespace (`ghcr.io/<owner>/fich-frontend`).
#   2. SSH into the VPS and run /opt/fich/scripts/deploy-frontend.sh
#      with the new image tag. The deploy script pulls the image,
#      recreates the `fich-frontend` container, health-checks it.
#
# Mirrors the backend's CI/CD shape (build → push → ssh → deploy)
# but uses GitHub-hosted runners + appleboy/ssh-action instead of
# the self-hosted prod-vps-1 runner, because this repo lives on
# the user's personal GH account while the runner is registered to
# the BlueOceanDevs org. Same net effect; no runner reconfiguration.
# ──────────────────────────────────────────────────────────────
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight builds when a newer commit lands — saves runner
# minutes and avoids deploying a stale tag right after a fresh one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercase the owner — GHCR rejects uppercase paths.
          images: ghcr.io/${{ github.repository_owner }}/fich-frontend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Baked into the client bundle — these are the PROD values.
          # Local dev uses .env.local; CI never sees that file.
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.fich.ai/api
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    # GitHub "environment: production" lets you set a required-
    # reviewer protection rule, matching how the backend gates its
    # prod deploys. Configure reviewers in repo Settings → Environments.
    environment: production
    steps:
      - name: SSH → run deploy script on VPS
        uses: appleboy/ssh-action@v1
        env:
          # Forwarded to the SSH session so the VPS-side script can
          # `docker login ghcr.io` with the same short-lived token the
          # build job used. No long-lived PAT lives on the VPS.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          # Tag was computed by docker/metadata-action — sha-<short>
          # is the unique, traceable form (no race with `latest`).
          script: |
            /opt/fich/scripts/deploy-frontend.sh "sha-$(echo ${{ github.sha }} | cut -c1-7)"
